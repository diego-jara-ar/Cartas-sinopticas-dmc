
name: Actualizar pronostico meteorologico RM

on:
  workflow_dispatch:

  schedule:
    - cron: "20 0,6,12,18 * * *"

permissions:
  contents: write

concurrency:
  group: pronostico-meteorologico-rm
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar pronosticos
        run: python panel-meteorologico/actualizar_pronostico.py

      - name: Guardar datos meteorologicos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add panel-meteorologico/datos.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar pronostico meteorologico RM"
            git push
          fi
